name: Build example - TI CC27XX

on:
    workflow_dispatch:
    push:
        branches:
            - ti-cc2745-mss
        tags:
            - 'v*'

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
    cancel-in-progress: true

env:
    CHIP_NO_LOG_TIMESTAMPS: true

jobs:
    cc27xx:
        name: cc27xx

        env:
            BUILD_TYPE: gn_cc27xx

        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'

        container:
            image: ghcr.io/project-chip/chip-build-ti:81
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install ZAP
              shell: bash
              run: |
                  ZAP_VERSION="$(cat scripts/setup/zap.version)"
                  case "$(uname -m)" in
                      x86_64) ZAP_FLAVOR=linux-x64 ;;
                      aarch64 | arm64) ZAP_FLAVOR=linux-arm64 ;;
                      *) echo "Unsupported ZAP platform: $(uname -sm)" && exit 1 ;;
                  esac

                  ZAP_ROOT="${RUNNER_TEMP:-/tmp}/zap"
                  ZAP_ARCHIVE="${RUNNER_TEMP:-/tmp}/zap.zip"
                  rm -rf "$ZAP_ROOT"
                  mkdir -p "$ZAP_ROOT"
                  wget -q -O "$ZAP_ARCHIVE" "https://github.com/project-chip/zap/releases/download/${ZAP_VERSION}/zap-${ZAP_FLAVOR}.zip"
                  python3 - "$ZAP_ARCHIVE" "$ZAP_ROOT" <<'PY'
                  import sys
                  import zipfile

                  archive, output = sys.argv[1:]
                  with zipfile.ZipFile(archive) as zap:
                      zap.extractall(output)
                  PY
                  chmod +x "$ZAP_ROOT/zap-cli"
                  echo "ZAP_INSTALL_PATH=$ZAP_ROOT" >> "$GITHUB_ENV"

                  python3 - <<'PY'
                  import json

                  path = "scripts/setup/environment.json"
                  with open(path, encoding="utf-8") as f:
                      config = json.load(f)

                  config["cipd_package_files"] = [
                      package for package in config["cipd_package_files"]
                      if package != "scripts/setup/zap.json"
                  ]

                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(config, f, indent=4)
                      f.write("\n")
                  PY

            - name: Checkout submodules & Bootstrap
              uses: ./.github/actions/checkout-submodules-and-bootstrap
              with:
                  platform: cc27xx
                  extra-submodule-parameters: " --recursive"

            - name: Install TI SysConfig
              shell: bash
              run: |
                  if [ ! -d /opt/ti/sysconfig_1.26.3 ]; then
                      wget https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-nsUM6f7Vvb/1.26.3.4558/sysconfig-1.26.3_4558-setup.run
                      chmod +x sysconfig-1.26.3_4558-setup.run
                      ./sysconfig-1.26.3_4558-setup.run --mode unattended
                  fi
                  echo "TI_SYSCONFIG_ROOT=/opt/ti/sysconfig_1.26.3" >> "$GITHUB_ENV"

            - name: Install TI-validated Arm GCC
              shell: bash
              run: |
                  set -euo pipefail
                  TOOLCHAIN_NAME=arm-gnu-toolchain-12.3.rel1-x86_64-arm-none-eabi
                  TOOLCHAIN_ROOT="${RUNNER_TEMP:-/tmp}/${TOOLCHAIN_NAME}"
                  TOOLCHAIN_ARCHIVE="${RUNNER_TEMP:-/tmp}/${TOOLCHAIN_NAME}.tar.xz"
                  TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu/12.3.rel1/binrel/${TOOLCHAIN_NAME}.tar.xz"
                  TOOLCHAIN_SHA256=12a2815644318ebcceaf84beabb665d0924b6e79e21048452c5331a56332b309

                  if [ ! -x "$TOOLCHAIN_ROOT/bin/arm-none-eabi-gcc" ]; then
                      wget -q -O "$TOOLCHAIN_ARCHIVE" "$TOOLCHAIN_URL"
                      echo "$TOOLCHAIN_SHA256  $TOOLCHAIN_ARCHIVE" | sha256sum --check --strict
                      tar -xJf "$TOOLCHAIN_ARCHIVE" -C "${RUNNER_TEMP:-/tmp}"
                  fi
                  echo "TI_ARM_GCC_ROOT=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

            - name: Install TI Arm Clang
              shell: bash
              run: |
                  set -euo pipefail
                  TOOLCHAIN_NAME=ti-cgt-armllvm_4.0.4.LTS
                  TOOLCHAIN_ROOT="${RUNNER_TEMP:-/tmp}/${TOOLCHAIN_NAME}"
                  TOOLCHAIN_INSTALLER="${RUNNER_TEMP:-/tmp}/ti_cgt_armllvm_4.0.4.LTS_linux-x64_installer.bin"
                  TOOLCHAIN_URL="https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-ayxs93eZNN/4.0.4.LTS/ti_cgt_armllvm_4.0.4.LTS_linux-x64_installer.bin"
                  TOOLCHAIN_SHA256=98c60ecc259a07a54be6fcc0f55990332f493bfe5dad460c0ba83963f5dcb06f

                  if [ ! -x "$TOOLCHAIN_ROOT/bin/tiarmclang" ]; then
                      wget -q -O "$TOOLCHAIN_INSTALLER" "$TOOLCHAIN_URL"
                      echo "$TOOLCHAIN_SHA256  $TOOLCHAIN_INSTALLER" | sha256sum --check --strict
                      chmod +x "$TOOLCHAIN_INSTALLER"
                      "$TOOLCHAIN_INSTALLER" --mode unattended --prefix "$TOOLCHAIN_ROOT"
                  fi

                  TI_ARMCLANG_BIN=$(find "$TOOLCHAIN_ROOT" -type f -path '*/bin/tiarmclang' -perm -u+x -print -quit)
                  if [ -z "$TI_ARMCLANG_BIN" ]; then
                      echo "TI Arm Clang installation did not produce bin/tiarmclang under $TOOLCHAIN_ROOT" >&2
                      find "$TOOLCHAIN_ROOT" -maxdepth 3 -type f -print >&2
                      exit 1
                  fi
                  TOOLCHAIN_ROOT=$(dirname "$(dirname "$(readlink -f "$TI_ARMCLANG_BIN")")")
                  "$TOOLCHAIN_ROOT/bin/tiarmclang" --version
                  echo "TI_ARMCLANG_ROOT=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

            - name: Build examples
              run: |
                  scripts/run_in_build_env.sh '
                      set -euo pipefail

                      export PATH="${TI_ARM_GCC_ROOT}/bin:${TI_ARMCLANG_ROOT}/bin:$PATH"
                      GCC_VERSION=$(arm-none-eabi-gcc -dumpfullversion)
                      if [[ "$GCC_VERSION" != 12.3.1* ]]; then
                          echo "Expected Arm GCC 12.3.1, found: $GCC_VERSION" >&2
                          exit 1
                      fi
                      if [ ! -x "$TI_ARMCLANG_ROOT/bin/tiarmclang" ]; then
                          echo "TI Arm Clang executable is missing: $TI_ARMCLANG_ROOT/bin/tiarmclang" >&2
                          exit 1
                      fi
                      TI_ARMCLANG_VERSION=$("$TI_ARMCLANG_ROOT/bin/tiarmclang" --version)
                      if [[ "$TI_ARMCLANG_VERSION" != *"4.0.4.LTS"* ]]; then
                          echo "Expected TI Arm Clang 4.0.4.LTS, found: $TI_ARMCLANG_VERSION" >&2
                          exit 1
                      fi

                      BUILD_DIR=out/ti-cc27xx-lighting-ftd
                      ARTIFACT_DIR=out/artifacts/ti-cc27xx-lighting-ftd
                      APP_NAME=chip-LP_EM_CC2745R10_Q1-lighting-example
                      TI_SDK_DIR=third_party/ti_simplelink_sdk/repo_cc23xx_cc27xx
                      EXPECTED_TI_SDK_COMMIT=68ca021502383f367d0bf2a5517fdd0dcb0ef909

                      ACTUAL_TI_SDK_COMMIT=$(git -C "$TI_SDK_DIR" rev-parse HEAD)
                      if [ "$ACTUAL_TI_SDK_COMMIT" != "$EXPECTED_TI_SDK_COMMIT" ]; then
                          echo "Unexpected TI SDK commit: $ACTUAL_TI_SDK_COMMIT" >&2
                          exit 1
                      fi

                      GCC_BIN=$(command -v arm-none-eabi-gcc)
                      GCC_ARMCOMPILER=$(dirname "$(dirname "$(readlink -f "$GCC_BIN")")")
                      CMAKE_BIN=$(command -v cmake)
                      export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)

                      make -C "$TI_SDK_DIR" build-gcc \
                          CMAKE="$CMAKE_BIN" \
                          GCC_ARMCOMPILER="$GCC_ARMCOMPILER" \
                          TICLANG_ARMCOMPILER= \
                          IAR_ARMCOMPILER=

                      make -C "$TI_SDK_DIR" build-ticlang \
                          CMAKE="$CMAKE_BIN" \
                          GCC_ARMCOMPILER= \
                          TICLANG_ARMCOMPILER="$TI_ARMCLANG_ROOT" \
                          IAR_ARMCOMPILER=

                      REQUIRED_TI_LIBRARIES=(
                          source/ti/drivers/lib/gcc/m33f/drivers_cc27xxx10.a
                          source/ti/devices/cc27xxx10/driverlib/lib/gcc/driverlib.a
                          source/ti/drivers/secure/lib/ticlang/m33f/secure_drivers_cc27xxx10.a
                          source/third_party/hsmddk/lib/ticlang/m33f/hsmddk_cc27xxx10_its.a
                          source/ti/drivers/rcl/lib/gcc/m33f/rcl_cc27xxx10.a
                          source/ti/devices/cc27xxx10/rf_patches/lib/gcc/m33f/lrf_cc27xxx10.a
                          source/third_party/psa_crypto/lib/ticlang/m33f/psa_crypto_cc27xx.a
                          source/ti/ble/lib/CC27XXX10/OneLib/lib/ticlang/m33f/OneLib.a
                          source/ti/ble/lib/CC27XXX10/StackWrapper/lib/ticlang/m33f/StackWrapper.a
                      )
                      for library in "${REQUIRED_TI_LIBRARIES[@]}"; do
                          if [ ! -s "$TI_SDK_DIR/$library" ]; then
                              echo "Required TI SDK library is missing: $library" >&2
                              exit 1
                          fi
                      done

                      gn gen "$BUILD_DIR" --root=examples/lighting-app/ti/cc27xx --args="
                          ti_sysconfig_root=\"${TI_SYSCONFIG_ROOT}\"
                          ti_simplelink_board=\"LP_EM_CC2745R10_Q1\"
                          chip_generate_link_map_file=true
                          chip_openthread_ftd=true
                          chip_progress_logging=true
                          chip_enable_additional_data_advertising=true
                          chip_enable_rotating_device_id=true
                          custom_factory_data=true
                          ti_dac_key_use_psa_hsm=true
                          target_defines=[
                              \"TI_ATTESTATION_CREDENTIALS=1\",
                              \"TI_CC27XX_FREERTOS_HEAP_SIZE=43008\",
                          ]
                      "
                      ninja -C "$BUILD_DIR" \
                          "${APP_NAME}.out" \
                          "${APP_NAME}-without-factory-data.hex"

                      cmp "$BUILD_DIR/gen/secure_drivers_cc27xxx10.a" \
                          "$TI_SDK_DIR/source/ti/drivers/secure/lib/ticlang/m33f/secure_drivers_cc27xxx10.a"
                      cmp "$BUILD_DIR/gen/hsmddk_cc27xxx10_its.a" \
                          "$TI_SDK_DIR/source/third_party/hsmddk/lib/ticlang/m33f/hsmddk_cc27xxx10_its.a"

                      if ! arm-none-eabi-nm "$BUILD_DIR/${APP_NAME}.out" |
                          grep -E "^[0-9a-fA-F]+[[:space:]]+T[[:space:]]+tfm_hal_its_fs_info$" > /dev/null; then
                          echo "Expected strong tfm_hal_its_fs_info override" >&2
                          exit 1
                      fi
                      if ! arm-none-eabi-strings "$BUILD_DIR/${APP_NAME}.out" |
                          grep -F "ChipOBLE C3 Char" > /dev/null; then
                          echo "Expected Matter BLE C3 Additional Data characteristic in cc27xx lighting app" >&2
                          exit 1
                      fi

                      python3 third_party/ti_simplelink_sdk/validate_cc27xx_image.py \
                          --map "$BUILD_DIR/${APP_NAME}.out.map" \
                          --hex "$BUILD_DIR/${APP_NAME}-without-factory-data.hex"

                      if ! grep -Eq "^\\.resetVecs[[:space:]]+0x0*80[[:space:]]" "$BUILD_DIR/${APP_NAME}.out.map"; then
                          echo "Matter vector table is not linked at the TI ROM Secure Boot load address 0x80" >&2
                          exit 1
                      fi
                      if ! grep -Eq "^FLASH[[:space:]]+0x0*80[[:space:]]+0x0*db940[[:space:]]" "$BUILD_DIR/${APP_NAME}.out.map"; then
                          echo "Matter FLASH region does not reserve the TI ROM Secure Boot header and trailer" >&2
                          exit 1
                      fi

                      arm-none-eabi-objcopy -O binary --only-section=.ccfg \
                          "$BUILD_DIR/${APP_NAME}.out" "$BUILD_DIR/${APP_NAME}-ccfg.bin"
                      arm-none-eabi-objcopy -O binary --only-section=.scfg \
                          "$BUILD_DIR/${APP_NAME}.out" "$BUILD_DIR/${APP_NAME}-scfg.bin"
                      python3 -c "import sys; from pathlib import Path; ccfg=Path(sys.argv[1]).read_bytes(); scfg=Path(sys.argv[2]).read_bytes(); assert len(ccfg)==2048; assert len(scfg)==1024; assert int.from_bytes(ccfg[8:12], byteorder=\"little\")==128" \
                          "$BUILD_DIR/${APP_NAME}-ccfg.bin" "$BUILD_DIR/${APP_NAME}-scfg.bin"

                      mkdir -p "$ARTIFACT_DIR"
                      cp "$BUILD_DIR/${APP_NAME}.out" "$ARTIFACT_DIR/"
                      cp "$BUILD_DIR/${APP_NAME}.out.map" "$ARTIFACT_DIR/"
                      cp "$BUILD_DIR/${APP_NAME}-without-factory-data.hex" "$ARTIFACT_DIR/"
                  '

            - name: Upload unsigned build artifacts
              uses: actions/upload-artifact@v7
              if: ${{ !env.ACT }}
              with:
                  name: cc27xx-lighting-unsigned
                  path: out/artifacts/ti-cc27xx-lighting-ftd/

            - name: Set up snb-command
              if: ${{ !env.ACT }}
              env:
                  snbAccessKey: ${{ secrets.IOT_ACCESS_KEY }}
                  snbSecretKey: ${{ secrets.IOT_SECRET_KEY }}
                  serviceAddress: ${{ secrets.IOT_SERVICE_ADDRESS }}
              run: |
                  wget https://github.com/yue-leaf/cli-test/releases/download/v1.0.4/snb
                  chmod +x snb
                  ln -s "$(pwd)/snb" /usr/local/bin/snb
                  snb config --serviceAddress "$serviceAddress" --accessKey "$snbAccessKey" --secretKey "$snbSecretKey"

            - name: Sign application firmware with SNB KMS
              if: ${{ !env.ACT }}
              env:
                  snbSignDataKey: ${{ secrets.IOT_SIGN_DATA_KEY_ID }}
              run: |
                  scripts/run_in_build_env.sh '
                      set -euo pipefail

                      BUILD_DIR=out/ti-cc27xx-lighting-ftd
                      APP_NAME=chip-LP_EM_CC2745R10_Q1-lighting-example
                      TI_SDK_DIR=third_party/ti_simplelink_sdk/repo_cc23xx_cc27xx
                      IMGTOOL_DIR="$TI_SDK_DIR/source/third_party/mcuboot/scripts"
                      PROPERTIES=scripts/tools/ti/cc2745_secure_boot_properties.json
                      SECURE_BOOT_DIR=out/artifacts/ti-cc27xx-lighting-secure-boot

                      export PATH="${TI_ARM_GCC_ROOT}/bin:$PATH"
                      command -v arm-none-eabi-objcopy > /dev/null
                      command -v snb > /dev/null
                      test -n "$snbSignDataKey"
                      test -f "$IMGTOOL_DIR/imgtool.py"

                      rm -rf "$SECURE_BOOT_DIR"
                      mkdir -p "$SECURE_BOOT_DIR"

                      python3 scripts/tools/ti/cc2745_secure_boot.py prepare \
                          --input "$BUILD_DIR/${APP_NAME}.out" \
                          --reference-hex "$BUILD_DIR/${APP_NAME}-without-factory-data.hex" \
                          --objcopy arm-none-eabi-objcopy \
                          --imgtool-dir "$IMGTOOL_DIR" \
                          --properties "$PROPERTIES" \
                          --output-dir "$SECURE_BOOT_DIR"

                      snb kms sign \
                          --keyId "$snbSignDataKey" \
                          --inputFile "$SECURE_BOOT_DIR/ti-cc27xx-imgtool-to-sign.bin" \
                          --outputFile "$SECURE_BOOT_DIR/ti-cc27xx-signature.der"

                      snb kms exportPubKey \
                          --keyId "$snbSignDataKey" \
                          --outputFormat PEM \
                          --outputFile "$SECURE_BOOT_DIR/public_key.pem"

                      python3 scripts/tools/ti/cc2745_secure_boot.py finalize \
                          --signature "$SECURE_BOOT_DIR/ti-cc27xx-signature.der" \
                          --public-key "$SECURE_BOOT_DIR/public_key.pem" \
                          --imgtool-dir "$IMGTOOL_DIR" \
                          --properties "$PROPERTIES" \
                          --output-dir "$SECURE_BOOT_DIR"

                      test -s "$SECURE_BOOT_DIR/signed-ti-cc27xx-lighting.bin"
                      test -s "$SECURE_BOOT_DIR/signed-ti-cc27xx-lighting-without-factory-data.hex"
                      test -s "$SECURE_BOOT_DIR/manifest.json"
                      if ! grep -a -F "ChipOBLE C3 Char" "$SECURE_BOOT_DIR/signed-ti-cc27xx-lighting.bin" > /dev/null; then
                          echo "signed Matter firmware is missing the BLE C3 Additional Data characteristic" >&2
                          exit 1
                      fi
                  '

            - name: Push signed application firmware
              if: ${{ !env.ACT }}
              env:
                  PRODUCT_ID: ${{ secrets.PRODUCT_ID }}
                  MODULE_NAME: ${{ secrets.MODULE_NAME }}
                  ENV: ${{ secrets.ENV }}
              shell: bash
              run: |
                  set -euo pipefail

                  SECURE_BOOT_DIR=out/artifacts/ti-cc27xx-lighting-secure-boot
                  FIRMWARE="$SECURE_BOOT_DIR/signed-ti-cc27xx-lighting-without-factory-data.hex"
                  test -s "$FIRMWARE"
                  test -n "$PRODUCT_ID"
                  test -n "$MODULE_NAME"
                  test -n "$ENV"

                  if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
                      VERSION="$GITHUB_REF_NAME"
                  else
                      VERSION="$GITHUB_SHA"
                  fi

                  snb obis push \
                      --file "$FIRMWARE" \
                      --fileType Application \
                      --productId "$PRODUCT_ID" \
                      --moduleName "$MODULE_NAME" \
                      --env "$ENV" \
                      --version "$VERSION"

            - name: Upload signed build artifacts
              uses: actions/upload-artifact@v7
              if: ${{ !env.ACT }}
              with:
                  name: cc27xx-lighting-signed
                  path: out/artifacts/ti-cc27xx-lighting-secure-boot/
