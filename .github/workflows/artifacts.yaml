name: 'Delete old artifacts'
on:
  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true
  
jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          expire-in: 14days
